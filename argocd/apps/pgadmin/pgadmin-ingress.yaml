apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
  rules:
  - host: pgadmin.greyroom.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name:  pgadmin
            port:
              number: 3004
  tls:
  - secretName: pgadmin-certificates-greyroom-net-production # <=== Use the name defined in Certificate resource.