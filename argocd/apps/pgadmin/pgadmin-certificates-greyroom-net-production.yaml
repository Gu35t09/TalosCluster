apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgadmin-certificates-greyroom-net-production
  namespace: pgadmin
spec:
  secretName: pgadmin-certificates-greyroom-net-production
  issuerRef:
    name: issuer-letsencrypt-production
    kind: ClusterIssuer
  commonName: "pgadmin.greyroom.net"
  dnsNames:
    - "pgadmin.greyroom.net"
