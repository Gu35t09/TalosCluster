apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  proxmox.yaml: |
    url: https://pve.greyroom.net:8006
    token: {{HOMEPAGE_VAR_PROXMOX_API_TOKEN}}
    secret: {{HOMEPAGE_VAR_PROXMOX_API_SECRET}}
  kubernetes.yaml: ""  #  mode: cluster
  settings.yaml: |
    title: My Awesome Homepage 
    theme: dark # <----- add this line
    color: slate # <----- add this line
    background:
      image: https://images.unsplash.com/photo-1722342618130-6bb50c18550a?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
      blur: sm # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
      saturate: 50 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
      brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
      opacity: 50 # 0-100

    providers:
      openwe  athermap: openweathermapapikey
      weatherapi: weathe

    useEqualHeights: true

    layout:
      Important Proxmox VM:
        header: true
        style: row
        columns: 2
      Hypervisor:
        header: true
        style: row
        columns: 1
      Docker:
        header: true
        style: row
        columns: 3
      Backup:
      Cloud services:
      Networking:
      Streaming:
        header: true
        style: row
        columns: 5
      Other:
        header: true
        style: row
        columns: 2

  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
        - Stack Overflow:
            - abbr: SO
              href: https://stackoverflow.com/

    - Social:
        - Linkedin:
            - abbr: LK
              href: https://it.linkedin.com/
        - Reddit:
            - abbr: RD
              href: https://www.reddit.com/

    - Entertainment:
        - Anime World:
            - abbr: AW
              href: https://www.animeworld.so/
        - YouTube:
            - abbr: YT
              href: https://youtube.com/

  services.yaml: |
    - Hypervisor:
        - Tartarus:
            icon: proxmox.png
            href: https://pve.greyroom.net:8006
            description: Proxmox VE
            widget:
                type: proxmox
                url: https://pve.greyroom.net:8006
                username: {{HOMEPAGE_VAR_PROXMOX_API_TOKEN}}
                password: {{HOMEPAGE_VAR_PROXMOX_API_SECRET}}

    - Important Proxmox VM:
      - Kubernetes Cluster:
          - k8s-talos-cp01:
              icon: proxmox.png
              description: Talos Cluster Control Plane 01
              proxmoxNode: pve
              proxmoxVMID: 201
          - k8s-talos-wrk01:
              icon: proxmox.png
              description: Talos Cluster Worker 01
              proxmoxNode: pve
              proxmoxVMID: 204
      - Other:
          - pandora:
              icon: proxmox.png
              description: Ubuntu server with Docker engine installed
              proxmoxNode: pve
              proxmoxVMID: 204

  widgets.yaml: |
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
        text_size: xl
        format:
          timeStyle: short

  docker.yaml: ""
