cilium:
  namespaceOverride: "kube-system"
  operator:
    replicas: 1
    unmanagedPodWatcher:
      restart: true # Post-Migration: restart unmigrated pods
  routingMode: tunnel # Migration: Optional: default is tunneling, configure as needed
  tunnelProtocol: vxlan # Migration: Optional: default is VXLAN, configure as needed
  tunnelPort: 8473 # Migration: Optional, change only if both networks use the same port by default
  cluster:
    name: talos-proxmox-dev-cluster
  cni:
    customConf: false # Post-Migration: install a CNI configuration file
    uninstall: false # Migration: Don't remove CNI configuration on shutdown
  ipam:
  #  mode: "cluster-pool"
    mode: "kubernetes"
    operator:
      clusterPoolIPv4PodCIDRList: ["10.245.0.0/16"] # Migration: Ensure this is distinct and unused
  policyEnforcementMode: "default" # Migration: Disable policy enforcement
  bpf:
    hostLegacyRouting: false # Post-Migration: Disallow for routing between Cilium and the existing overlay
  kubeProxyReplacement: false # Needed since kube-proxy in installed on Talos Linux
  # Talos Linux stuff
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup