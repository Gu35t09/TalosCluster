apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-talos-wrk01-local-pv01
  labels:
    type: local-storage
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/mnt/local-storage # Path where the disk /dev/vdb is mounted by Talos
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-talos-wrk01